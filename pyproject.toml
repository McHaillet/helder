[build-system]
requires = ["setuptools>=61.0", "setuptools_scm>=8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "helder"
description = "Simultaneous denoising and missing wedge reconstruction of cryo-ET tomograms."
readme = "README.md"
authors = [
    { name = "Marten Chaillet", email = "martenchaillet@gmail.com" },
]
requires-python = ">=3.7.0"
dynamic = ["version"]
dependencies = [
    "numpy>=1.26.4",
    "matplotlib>=3.8.4",
    "mrcfile>=1.5.0",
    "pytorch-lightning>=1.8.0",
    "PyYAML>=6.0.1",
    "tqdm>=4.65.0",
    "typer>=0.12.0",
    "typer-config>=1.4.0",
    "typing_extensions>=4.9.0",
]

[project.optional-dependencies]
test = ["pytest"]

[project.scripts]
helder = "helder.app:main"

[tool.setuptools]
packages = ["helder", "helder.utils"]

[tool.setuptools_scm]
